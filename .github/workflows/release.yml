name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    name: Publish crates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            echo "Expected format: vX.Y.Z"
            exit 1
          fi

      - name: Validate package versions
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"

          echo "Expected version: $VERSION"
          echo

          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | "\(.name) \(.version)"' \
            | while read -r NAME PACKAGE_VERSION; do
                echo "$NAME: $PACKAGE_VERSION"

                if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
                  echo
                  echo "Version mismatch:"
                  echo "  Package: $NAME"
                  echo "  Expected: $VERSION"
                  echo "  Found: $PACKAGE_VERSION"
                  exit 1
                fi
              done
      - name: Publish workspace crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          PACKAGES=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | [.name, .version, .manifest_path] | @tsv')

          while IFS=$'\t' read -r NAME VERSION MANIFEST_PATH; do
            echo "Publishing $NAME@$VERSION..."

            OUTPUT=$(cargo publish \
              --manifest-path "$MANIFEST_PATH" 2>&1) || STATUS=$?

            echo "$OUTPUT"

            if [ -z "$STATUS" ]; then
              echo "$NAME@$VERSION published successfully."
              continue
            fi

            if echo "$OUTPUT" | grep -q "already exists"; then
              echo "$NAME@$VERSION already exists on crates.io. Skipping."
              unset STATUS
              continue
            fi

            echo "Failed to publish $NAME@$VERSION."
            exit "$STATUS"
          done <<< "$PACKAGES"
