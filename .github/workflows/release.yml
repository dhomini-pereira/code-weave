name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    name: Publish crates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Run tests
        run: cargo test --workspace

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            echo "Expected format: vX.Y.Z"
            exit 1
          fi

      - name: Validate package versions
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"

          echo "Expected version: $VERSION"
          echo

          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | "\(.name) \(.version)"' \
            | while read -r NAME PACKAGE_VERSION; do
                echo "$NAME: $PACKAGE_VERSION"

                if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
                  echo
                  echo "Version mismatch:"
                  echo "  Package: $NAME"
                  echo "  Expected: $VERSION"
                  echo "  Found: $PACKAGE_VERSION"
                  exit 1
                fi
              done
      - name: Publish workspace crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          PACKAGES=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | [.name, .version, .manifest_path] | @tsv')

          while IFS=$'\t' read -r NAME VERSION MANIFEST_PATH; do
            echo "Checking $NAME@$VERSION..."

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://crates.io/api/v1/crates/$NAME/$VERSION")

            if [ "$STATUS" = "200" ]; then
              echo "$NAME@$VERSION already exists on crates.io. Skipping."
              continue
            fi

            echo "Publishing $NAME@$VERSION..."

            cargo publish \
              --manifest-path "$MANIFEST_PATH"

            echo "Waiting for $NAME@$VERSION to become available..."

            for i in {1..12}; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                "https://crates.io/api/v1/crates/$NAME/$VERSION")

              if [ "$STATUS" = "200" ]; then
                echo "$NAME@$VERSION is now available."
                break
              fi

              echo "Still waiting... ($i/12)"
              sleep 10
            done

            if [ "$STATUS" != "200" ]; then
              echo "Timed out waiting for $NAME@$VERSION to become available."
              exit 1
            fi
          done <<< "$PACKAGES"
